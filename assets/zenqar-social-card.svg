<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Zenqar</title>
  <desc id="desc">Free invoicing and bookkeeping built for modern business</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080914"/>
      <stop offset="0.55" stop-color="#171027"/>
      <stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7968ff"/>
      <stop offset="1" stop-color="#d85bd5"/>
    </linearGradient>
    <radialGradient id="glowTop">
      <stop offset="0" stop-color="#975bff" stop-opacity="0.52"/>
      <stop offset="0.68" stop-color="#975bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom">
      <stop offset="0" stop-color="#ff51cc" stop-opacity="0.35"/>
      <stop offset="0.68" stop-color="#ff51cc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1090" cy="-50" r="260" fill="url(#glowTop)"/>
  <circle cx="370" cy="690" r="250" fill="url(#glowBottom)"/>

  <rect x="78" y="68" width="56" height="56" rx="17" fill="url(#brand)"/>
  <text x="106" y="108" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">Z</text>
  <text x="152" y="108" fill="#f8f7ff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="4">ZENQAR</text>
  <rect x="942" y="74" width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="1032" y="101" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">ALL-IN-ONE</text>

  <text x="78" y="231" fill="#f8f7ff" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="800" letter-spacing="-2">
    <tspan x="78" dy="0">Free invoicing and</tspan>
    <tspan x="78" dy="70">bookkeeping, built for</tspan>
    <tspan x="78" dy="70">modern business.</tspan>
  </text>
  <text x="78" y="463" fill="#c9c5dc" font-family="Arial, Helvetica, sans-serif" font-size="24">
    Invoices, cash flow, AI document scanning, private voice messages,
  </text>
  <text x="78" y="498" fill="#c9c5dc" font-family="Arial, Helvetica, sans-serif" font-size="24">and one-to-one calls in one focused workspace.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e8e5f4">
    <rect x="78" y="548" width="128" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="142" y="574" text-anchor="middle">Free plan</text>
    <rect x="218" y="548" width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="292" y="574" text-anchor="middle">AI scanning</text>
    <rect x="378" y="548" width="164" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="460" y="574" text-anchor="middle">Private voice</text>
  </g>
  <text x="1122" y="575" text-anchor="end" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">zenqar.com</text>
</svg>
